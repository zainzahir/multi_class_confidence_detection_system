<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Confidence Detector - Forgot Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            overflow: hidden;
        }

        /* Animated background orbs */
        body::before,
        body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
            z-index: 0;
            animation: floatOrb 8s ease-in-out infinite alternate;
        }

        body::before {
            width: 400px;
            height: 400px;
            background: #a78bfa;
            top: -100px;
            left: -100px;
        }

        body::after {
            width: 350px;
            height: 350px;
            background: #667eea;
            bottom: -80px;
            right: -80px;
            animation-delay: 3s;
            animation-direction: alternate-reverse;
        }

        @keyframes floatOrb {
            0%   { transform: translate(0, 0) scale(1); }
            100% { transform: translate(60px, 40px) scale(1.15); }
        }

        /* Card entrance animation */
        @keyframes fadeSlideUp {
            0% {
                opacity: 0;
                transform: translateY(40px) scale(0.97);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .login-card {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 24px;
            padding: 48px 40px 40px;
            width: 100%;
            max-width: 440px;
            box-shadow:
                0 8px 32px rgba(102, 126, 234, 0.18),
                0 2px 8px rgba(0, 0, 0, 0.06);
            animation: fadeSlideUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        .logo-section {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-emoji {
            font-size: 48px;
            display: block;
            margin-bottom: 12px;
            animation: bounceIn 0.6s 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }

        @keyframes bounceIn {
            0%   { opacity: 0; transform: scale(0.3); }
            60%  { transform: scale(1.08); }
            100% { opacity: 1; transform: scale(1); }
        }

        .logo-title {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.3;
        }

        .logo-subtitle {
            font-size: 13px;
            color: #94a3b8;
            font-weight: 400;
            margin-top: 8px;
            line-height: 1.5;
        }

        /* Flash Messages */
        .flash-messages {
            margin-bottom: 20px;
        }

        .flash-msg {
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            animation: fadeSlideUp 0.4s ease forwards;
        }

        .flash-msg.error,
        .flash-msg.danger {
            background: #fef2f2;
            color: #dc2626;
            border: 1px solid #fecaca;
        }

        .flash-icon {
            font-size: 16px;
            flex-shrink: 0;
        }

        /* Form */
        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #475569;
            margin-bottom: 6px;
            letter-spacing: 0.02em;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            color: #1e293b;
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            outline: none;
            transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .form-group input::placeholder {
            color: #94a3b8;
        }

        .form-group input:focus {
            border-color: #667eea;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.12);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            font-family: 'Poppins', sans-serif;
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            letter-spacing: 0.02em;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .back-link {
            text-align: center;
            margin-top: 28px;
            font-size: 13px;
            color: #94a3b8;
        }

        .back-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .back-link a:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        .particle {
            position: fixed;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            pointer-events: none;
            z-index: 0;
        }

        .particle:nth-child(1) { width: 6px; height: 6px; top: 15%; left: 10%; animation: drift 12s ease-in-out infinite; }
        .particle:nth-child(2) { width: 8px; height: 8px; top: 70%; left: 85%; animation: drift 15s ease-in-out infinite reverse; }

        @keyframes drift {
            0%, 100% { transform: translate(0, 0) rotate(0deg); opacity: 0.4; }
            50%      { transform: translate(-15px, -40px) rotate(180deg); opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="particle"></div>
    <div class="particle"></div>

    <div class="login-card">
        <!-- Logo -->
        <div class="logo-section">
            <span class="logo-emoji">🔑</span>
            <div class="logo-title">Reset Password</div>
            <div class="logo-subtitle">Enter your email address and we'll send you a link to reset your password.</div>
        </div>

        <!-- Flash Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="flash-messages">
                    {% for category, message in messages %}
                        <div class="flash-msg {{ category }}">
                            <span class="flash-icon">⚠️</span>
                            <span>{{ message }}</span>
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <!-- Form -->
        <form action="{{ url_for('forgot_password') }}" method="POST">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    required
                >
            </div>

            <button type="submit" class="btn-submit">Send Reset Link</button>
        </form>

        <div class="back-link">
            Back to <a href="{{ url_for('login') }}">Login</a>
        </div>
    </div>
</body>
</html>
